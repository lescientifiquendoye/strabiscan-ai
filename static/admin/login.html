<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StrabiScan AI — Admin</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <h1>🔒 StrabiScan Admin</h1>

    <div id="alert" class="alert alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Identifiant</label>
        <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary w-full" id="btn-login" style="margin-top:0.5rem">
        Se connecter
      </button>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:0.82rem">
      <a href="/" style="color:var(--color-primary);text-decoration:none">← Retour à l'application</a>
    </p>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem("admin_token")) {
    window.location.href = "/admin/dashboard";
  }

  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    const btn   = document.getElementById("btn-login");
    const alert = document.getElementById("alert");
    alert.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Connexion…";

    try {
      const res  = await fetch("/api/admin/login", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.detail || "Erreur de connexion");

      localStorage.setItem("admin_token", data.access_token);
      window.location.href = "/admin/dashboard";
    } catch (err) {
      alert.textContent = err.message;
      alert.classList.add("show");
      btn.disabled    = false;
      btn.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
